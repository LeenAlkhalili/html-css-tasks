<!DOCTYPE html>
<head>
<style>
    body{
        background-color: lightyellow;
    }
    .container{
        background-color: white;
        display: grid;
        grid-template-columns: 1fr;
        border-radius: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 25%;
        padding: 10px;
        margin: 40px;
        margin-left: 38%;
    }
    img{
        height: 70px;
        border-radius: 50px;
        grid-row: span 2;
    }
    
    .user{
        display: inline-block;
        vertical-align: top;
    }
    h4{
        margin: 0;
        padding-left: 5px;
        padding-top: 20px;
    }
     h5 {
        padding-top: 2px;
        margin: 0;
        color: rgb(146, 146, 146);
    }
</style>
</head>

<body>
    <div class="container">
        <div> <img src="./user.jpg" >

            <h4 >User #1</h4>
            <h5>Amman , Jordan</h5></div>

        </div>
        <div> <img src="./user.jpg" >

            </div>
        <hr>
        </div>
        <div> <img src="./user.jpg" >

            <h4>User #3</h4>
            <h5>Zarqa , Jordan</h5>
            </div>
        <hr>

        </div>
    </div>


</body>
</html>
